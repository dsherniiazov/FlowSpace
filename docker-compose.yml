services:
  db:
    image: postgres:17.5
    container_name: flowspace_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: flowspace
    ports:
      - "5432:5432"
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: flowspace_api
    restart: always
    command: python -m backend.run
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - ${FILES_HOST_DIR:-flowspace_files_data}:${FILES_DIR:-/data/files}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: flowspace_frontend
    restart: always
    env_file:
      - .env
    environment:
      API_TARGET: http://api:8000
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  postgres_data:
  flowspace_files_data:
